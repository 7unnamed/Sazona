services:
  traefik:
    image: traefik:v3.5
    container_name: traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.email=deorzco2@gmail.com
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
    networks:
      - postgres_app-network

  auth-api:
    build:
      context: .
      dockerfile: src/Services/Auth/Auth.Api/Dockerfile
    container_name: auth-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
    volumes:
      - ./logs/auth-api:/app/logs
    networks:
      - postgres_app-network

  meals-api:
    build:
      context: .
      dockerfile: src/Services/Meals/Meals.Api/Dockerfile
    container_name: meals-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
    volumes:
      - ./logs/meals-api:/app/logs
      - ./uploads/meals-api:/app/wwwroot/uploads
    networks:
      - postgres_app-network

  planner-api:
    build:
      context: .
      dockerfile: src/Services/Planner/Planner.Api/Dockerfile
    container_name: planner-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
    volumes:
      - ./logs/planner-api:/app/logs
    networks:
      - postgres_app-network

  api-gateway:
    build:
      context: .
      dockerfile: src/Gateway/ApiGateway/Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    labels:
      - traefik.enable=true
      - traefik.http.routers.api-gateway.rule=Host(`api.sazona.dev`)
      - traefik.http.routers.api-gateway.entrypoints=websecure
      - traefik.http.routers.api-gateway.tls.certresolver=letsencrypt
      - traefik.http.services.api-gateway.loadbalancer.server.port=8080
    volumes:
      - ./logs/api-gateway:/app/logs
    depends_on:
      - auth-api
      - meals-api
      - planner-api
    networks:
      - postgres_app-network

networks:
  postgres_app-network:
    external: true
