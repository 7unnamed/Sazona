services:
  meals-api:
    build:
      context: .
      dockerfile: src/Services/Meals.Api/Dockerfile
    container_name: meals-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - postgres_app-network

  planner-api:
    build:
      context: .
      dockerfile: src/Services/Planner.Api/Dockerfile
    container_name: planner-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - postgres_app-network

  api-gateway:
    build:
      context: .
      dockerfile: src/Gateway/ApiGateway/Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "80:8080"
    depends_on:
      - meals-api
      - planner-api
    networks:
      - postgres_app-network

networks:
  postgres_app-network:
    external: true
